    <!-- Service worker (public/sw.js): abre sem internet e acrescenta COOP/COEP, que o banco local
         (expo-sqlite wasm) exige e o GitHub Pages não define. Só é registrado depois que o usuário
         escolhe guardar os dados neste aparelho (src/web/storage-mode.ts); no modo "sem salvar" não
         há service worker. Quem já usava o app (página controlada por ele) conta como "neste
         aparelho". Quando ele assume, a página recarrega uma vez (nunca no modo sem salvar, que
         perderia o que está na memória). Versão nova só entra quando o usuário toca no aviso do app
         (src/web/service-worker.ts); aí ele assume e a página recarrega. -->
    <script id="navigo-sw">
      (function () {
        var sw = navigator.serviceWorker;
        if (!sw || !window.isSecureContext) return;
        var started = false;
        window.navigoStartSW = function () {
          if (started) return;
          started = true;
          if (sw.controller) {
            // Safari e outros sem `window.chrome`: COEP credentialless, como no coi-serviceworker.
            sw.controller.postMessage({
              type: 'coepCredentialless',
              value: !(window.chrome || window.netscape),
            });
          }
          var reloading = false;
          sw.addEventListener('controllerchange', function () {
            if (reloading || window.navigoNoReload) return;
            reloading = true;
            location.reload();
          });
          sw.register('/navigo/app/sw.js').then(function (reg) {
            // Ativo, mas a página abriu sem ele (recarga forçada): recarrega para ficar isolada.
            if (
              reg.active &&
              !sw.controller &&
              window.crossOriginIsolated === false &&
              !window.navigoNoReload
            ) {
              location.reload();
            }
          });
        };
        var chosen = null;
        try {
          chosen = localStorage.getItem('navigo.storage');
          if (!chosen && sw.controller) {
            chosen = 'device';
            localStorage.setItem('navigo.storage', chosen);
          }
        } catch (e) {
          // sem armazenamento: o app abre no modo sem salvar
        }
        if (chosen === 'device') window.navigoStartSW();
      })();
    </script>
    <!-- Volta do login Google (src/services/google-auth.web.ts): guarda a resposta na aba e tira o
         token do endereço antes de o app ler a URL, voltando à tela onde o usuário estava. -->
    <script id="navigo-google-return">
      (function () {
        var hash = location.hash;
        if (!/[#&](access_token|error)=/.test(hash) || !/[#&]state=/.test(hash)) return;
        var to = null;
        try {
          sessionStorage.setItem('navigo.google.return', hash);
          to = sessionStorage.getItem('navigo.google.returnTo');
          sessionStorage.removeItem('navigo.google.returnTo');
        } catch (e) {
          // sem armazenamento: o login não se completa e o app segue desconectado
        }
        history.replaceState(null, '', to || location.pathname + location.search);
      })();
    </script>
